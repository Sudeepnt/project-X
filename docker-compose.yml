# Local, production-like stack:  docker compose up --build
# Cockpit and API: http://localhost:8010   ·   Mail catcher: http://localhost:8025
# For real deployments see docs/DEPLOY.md (managed Postgres, S3 storage, real SMTP, TLS in front).

x-app: &app
  build: .
  image: projectx:local
  env_file:
    - path: .env
      required: false
  environment: &env
    PX_ENV: ${PX_ENV:-dev}
    PX_DATABASE_URL: postgresql+asyncpg://projectx:projectx@db:5432/projectx
    PX_BASE_URL: ${PX_BASE_URL:-http://localhost:8010}
    PX_WEB_URL: ${PX_WEB_URL:-http://localhost:8010}
    PX_SMTP_HOST: ${PX_SMTP_HOST:-mailpit}
    PX_SMTP_PORT: ${PX_SMTP_PORT:-1025}
  volumes:
    - blobs:/data/blobs
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projectx"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["projectx", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "8010:8010"

  worker:
    <<: *app
    command: ["projectx", "worker"]
    healthcheck:
      disable: true

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
