name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PX_ENV: test
      PX_TEST_DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare database (non-superuser app role, so row-level security is enforced)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE projectx LOGIN PASSWORD 'projectx' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE projectx_test OWNER projectx"
          psql -h localhost -U postgres -d projectx_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION citext; CREATE EXTENSION pgcrypto; CREATE EXTENSION vector; CREATE EXTENSION pg_trgm;"
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy src
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pnpm version pinned in package.json
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: projectx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrate, then serve the API and cockpit)
        run: |
          docker network create px
          docker run -d --name db --network px -e POSTGRES_PASSWORD=postgres \
            -v "$PWD/infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro" pgvector/pgvector:pg18
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres -d projectx && break; sleep 2; done
          ENV="-e PX_ENV=dev -e PX_DATABASE_URL=postgresql+asyncpg://projectx:projectx@db:5432/projectx"
          docker run --rm --network px $ENV projectx:ci projectx migrate
          docker run -d --name api --network px -p 8010:8010 $ENV projectx:ci
          for i in $(seq 1 30); do curl -fsS localhost:8010/healthz && break; sleep 2; done
          curl -fsS localhost:8010/readyz
          curl -fsS localhost:8010/login | grep -q '<div id="root">'
          docker run --rm projectx:ci id -u | grep -qx 10001
      - name: Logs on failure
        if: failure()
        run: docker logs api || true
