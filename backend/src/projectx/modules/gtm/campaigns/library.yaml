    tier: scale
    channels: [newsletter, linkedin, instagram]
    content_mix: {email: 0.4, text: 0.3, image: 0.3}
    frequency: {newsletter: 1, linkedin: 2, instagram: 2}
    value_ratio: 4
    metrics: [partners_signed, new_leads]
    pipeline: partners
    steps: [Find businesses with the same audience and no overlap, Propose a specific swap for approval, Run it and track leads by partner link, Report results to the partner]
  - key: affiliate_program
    name: Affiliate program
    category: partnerships
    goals: [partnerships, sales]
    choose_when: You want others to sell for a commission
    when: {}
    strategies: [Affiliate links, Tiered commissions, Partner dashboard]
    runs: ai
    tier: scale
    channels: [email]
    content_mix: {email: 1.0}
    frequency: {email: 1}
    value_ratio: 3
    metrics: [partners_signed, revenue]
    steps: [Set commission tiers, Give each affiliate a tracked link and promo code, Share a monthly results report, Pay commissions on confirmed revenue]
  - key: directory_listings
    name: Marketplace and directory listings
    category: partnerships
    goals: [partnerships, reputation, demand]
    choose_when: Buyers browse lists
    when: {}
    strategies: [Google Business Profile, G2, App stores, Product Hunt, Collecting reviews]
    runs: ai_human
    tier: growth
    channels: []
    content_mix: {}
    frequency: {}
    value_ratio: 5
    metrics: [review_rating, new_leads]
    steps: [List where your buyers browse, Write consistent listings from the brand book, Ask happy customers for reviews, Keep listings fresh]
  - key: sponsorship
    name: Sponsorship
    category: partnerships
    goals: [partnerships, awareness]
    choose_when: An event, newsletter or podcast has your exact audience
    when: {needs_budget: true}
    strategies: [Sponsor slots, Speaking, Booth]
    runs: ai_human
    tier: scale
    channels: []
    content_mix: {}
    frequency: {}
    value_ratio: 3
    metrics: [new_leads, reach]
    budget_split: {sponsorships: 1.0}
    steps: [Shortlist sponsorships by audience fit and price per reader, Negotiate for approval, Provide a tracked link and code, Measure leads per sponsorship]
  - key: reseller_white_label
    name: Reseller, agency or white-label
    category: partnerships
    goals: [partnerships]
    choose_when: Others can sell you at scale
    when: {b2b: true}
    strategies: [Agency program, White-label version, Revenue share]
    runs: human
    tier: scale
    channels: [email, linkedin]
    content_mix: {email: 1.0}
    frequency: {email: 5}
    value_ratio: 3
    metrics: [partners_signed, revenue]
    pipeline: partners
    steps: [Define the partner offer and revenue share, Find agencies that serve your customer profile, Pitch and onboard partners, Support their first sales]

  # ------------------------------------------------------------------ keep and grow customers
  - key: onboarding
    name: Onboarding
    category: customer_success
    goals: [retention]
    choose_when: New customers
    when: {min_customers: 1}
    strategies: [Welcome sequence, Setup help, A quick first win]
    runs: ai
    tier: growth
    channels: [email, whatsapp]
    content_mix: {email: 1.0}
    frequency: {email: 2}
    value_ratio: 9
    metrics: [churn_rate]
    sequence: onboarding
    steps: [Welcome every customer the same day, Help them reach one quick win, Check in after the first week]
  - key: retention_win_back
    name: Retention and win-back
    category: customer_success
    goals: [retention]
    choose_when: Churn rising, or users inactive
    when: {min_customers: 10}
    strategies: [Re-engagement messages, Usage tips, Comeback offers]
    runs: ai
    tier: growth
    channels: [email, whatsapp]
    content_mix: {email: 1.0}
    frequency: {email: 1}
    value_ratio: 4
    metrics: [churn_rate]
    sequence: win_back
    steps: [Flag customers inactive for 14 days, Send a helpful check-in, not a sale, Offer a comeback deal to those who stay silent, Record why people leave]
  - key: upsell_cross_sell
    name: Upsell and cross-sell
    category: customer_success
    goals: [retention, sales]
    choose_when: Happy, active customers
    when: {min_customers: 10}
    strategies: [Offers triggered by usage, Upgrades, Add-ons, Turning one-time clients into retainers]
    runs: ai
    tier: growth
    channels: [email]
    content_mix: {email: 1.0}
    frequency: {email: 1}
    value_ratio: 3
    metrics: [upsell_revenue]
    steps: [Find customers who got results, Suggest the next step that fits their use, Offer a retainer to one-time clients who came back]
  - key: renewal
    name: Renewal
    category: customer_success
    goals: [retention]
    choose_when: Retainers or subscriptions coming due
    when: {min_customers: 1}
    strategies: [Reminders, Annual discount, What you got this year recap]
    runs: ai
    tier: growth
    channels: [email]
    content_mix: {email: 1.0}
    frequency: {email: 1}
    value_ratio: 4
    metrics: [upsell_revenue, churn_rate]
    steps: [Remind 30 and 7 days before renewal, Send a recap of what they got, Offer an annual plan]
  - key: customer_referral
    name: Customer referral
    category: customer_success
    goals: [retention, demand]
    choose_when: Customers love you
    when: {min_customers: 10}
    strategies: [Rewards for both sides, Leaderboards]
    runs: ai
    tier: growth
    channels: [email, newsletter]
    content_mix: {email: 1.0}
    frequency: {email: 1}
    value_ratio: 4
    metrics: [referrals]
    sequence: referral_request
    steps: [Ask right after a win or a high satisfaction score, Give both sides a reward, Show a simple leaderboard]
  - key: reviews_testimonials
    name: Reviews and testimonials
    category: customer_success
    goals: [reputation, retention]
    choose_when: You need social proof
    when: {min_customers: 5}
    strategies: [Ask right after a win, Show them everywhere, Never fake or paid]
    runs: ai
    tier: growth
    channels: [email]
    content_mix: {email: 1.0}
    frequency: {email: 1}
    value_ratio: 5
    metrics: [review_rating]
    steps: [Ask for a review right after a success, Make leaving it one click, Turn the best ones into proof posts with permission]
  - key: reputation_repair
    name: Reputation repair
    category: customer_success
    goals: [reputation]
    choose_when: Bad reviews or bad press
    when: {}
    strategies: [Respond fast, Own it, Fix it, Show proof]
    runs: ai_human
    tier: growth
    channels: [instagram, x, linkedin]
    content_mix: {text: 0.6, image: 0.4}
    frequency: {instagram: 2, x: 3, linkedin: 2}
    value_ratio: 6
    metrics: [review_rating, negative_share]
    approval_note: The owner approves every response first.
    steps: [Reply to every negative review within a day, Own the problem in plain words, Fix it and say how, Share proof of the fix]
