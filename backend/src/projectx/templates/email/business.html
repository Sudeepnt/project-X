<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ business_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;color:#1d1d1f;">
  {% if preheader %}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>{% endif %}
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:18px;padding:36px;">
        <tr><td style="font-size:14px;font-weight:600;color:#1d1d1f;padding-bottom:24px;">{{ business_name }}</td></tr>
        <tr><td style="font-size:16px;line-height:1.6;color:#1d1d1f;">{{ body_html }}</td></tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr><td style="font-size:12px;line-height:1.6;color:#86868b;padding:20px 8px;text-align:center;">
          {% if postal_address %}{{ postal_address }}<br>{% endif %}
          You're receiving this because you signed up with {{ business_name }}.
          <a href="{{ unsubscribe_url }}" style="color:#86868b;">Unsubscribe</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
