<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="{% block robots %}index,follow{% endblock %}">
<title>{% block title %}{{ business.name }}{% endblock %}</title>
{% block meta %}{% endblock %}
<style>
  :root {
    --accent: {{ primary or '#0071e3' }};
    --bg: #ffffff; --surface: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --hairline: rgba(0,0,0,.1);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --surface: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --hairline: rgba(255,255,255,.14); }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 24px 48px; }
  header.brand { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 56px; }
  header.brand a { color: var(--text); text-decoration: none; font-weight: 600; letter-spacing: -.01em; }
  h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.07; letter-spacing: -.025em; font-weight: 700; margin: 0 0 18px; }
  .lede { font-size: clamp(19px, 2.4vw, 23px); line-height: 1.4; color: var(--muted); margin: 0 0 32px; max-width: 36ch; }
  .grid { display: grid; gap: 48px; grid-template-columns: 1.1fr .9fr; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; gap: 32px; } header.brand { padding-bottom: 32px; } }
  ul.points { list-style: none; padding: 0; margin: 0 0 8px; }
  ul.points li { padding: 10px 0 10px 30px; position: relative; border-top: 1px solid var(--hairline); }
  ul.points li:last-child { border-bottom: 1px solid var(--hairline); }
  ul.points li::before { content: ""; position: absolute; left: 4px; top: 18px; width: 12px; height: 7px;
    border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg); }
  .card { background: var(--surface); border-radius: var(--radius); padding: 28px; }
  label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input[type=text], input[type=email], input[type=tel], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 13px 14px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); margin: 4px 0 20px; }
  .consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  button, .button {
    display: inline-flex; align-items: center; justify-content: center; width: 100%; border: 0; cursor: pointer;
    font: 600 17px/1 inherit; font-family: inherit; color: #fff; background: var(--accent);
    padding: 16px 22px; border-radius: 980px; text-decoration: none; transition: transform .1s, filter .15s;
  }
  button:hover, .button:hover { filter: brightness(1.06); }
  button:active { transform: scale(.985); }
  button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }
  .fine { font-size: 13px; color: var(--muted); margin-top: 14px; text-align: center; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--hairline); font-size: 13px; color: var(--muted); }
  .center { max-width: 560px; margin: 12vh auto 0; text-align: center; }
  .center .lede { margin-left: auto; margin-right: auto; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><a href="{{ business.website or '#' }}">{{ business.name }}</a></header>
  {% block content %}{% endblock %}
  <footer>© {{ business.name }}</footer>
</div>
</body>
</html>
